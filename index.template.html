<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ordini clienti</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#667085; --line:#e3e6eb;
  --accent:#c8102e; --accent-ink:#fff; --soft:#f0f2f5; --ok:#1a7f4b; --warn:#b54708; --bar:#c8102e; --bar2:#98a2b3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111317; --card:#1b1e24; --ink:#eceef2; --muted:#98a2b3; --line:#2c313a;
    --accent:#ff4d63; --accent-ink:#111317; --soft:#242831; --ok:#4cc38a; --warn:#f0a65a; --bar:#ff4d63; --bar2:#5b6472; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:14px 0 6px}
.muted{color:var(--muted)} .small{font-size:13px} .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
input[type=text],input[type=password],input[type=search],select{
  font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.link{background:none;color:var(--accent);padding:0;min-height:0;font-weight:600;text-align:left}
.err{color:var(--accent);margin-top:8px;min-height:20px}
/* navigazione: radio + label (touch iOS) */
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch;position:sticky;top:0;background:var(--bg);z-index:5}
.nav input{position:absolute;opacity:0;pointer-events:none}
.nav label{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.nav input:checked + label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sez{display:none} .sez.on{display:block}
.filtri{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.filtri{grid-template-columns:1fr}}
.tabwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr.tap{cursor:pointer}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:var(--soft);border-radius:10px;padding:9px 10px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.ris{list-style:none;margin:8px 0 0;padding:0}
.ris li{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
details.ord{border-bottom:1px solid var(--line)}
details.ord summary{list-style:none;display:flex;gap:10px;align-items:baseline;padding:10px 2px;cursor:pointer}
details.ord summary::-webkit-details-marker{display:none}
details.ord summary .d{flex:0 0 86px;font-variant-numeric:tabular-nums}
details.ord summary .t{flex:1;min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.ord[open] summary .t{white-space:normal}
.riga{padding:6px 2px 8px 12px;border-left:3px solid var(--line);margin:0 0 6px 4px;font-size:14px}
.riga .c{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:middle}
.badge.a{background:var(--accent);color:var(--accent-ink)}
.barra{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.barra i{display:block;height:10px;border-radius:5px;background:var(--bar);min-width:2px}
@media (max-width:480px){.barra{grid-template-columns:110px 1fr 78px}}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-size:11px}
svg .b{fill:var(--bar)} svg .b2{fill:var(--bar2)} svg .v{fill:var(--ink);font-size:10px}
.pos{color:var(--ok)} .neg{color:var(--accent)}
.leg{font-size:12px;color:var(--muted);margin:2px 0 6px} .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.leg i.a{background:var(--bar2)} .leg i.b{background:var(--bar)}
.anno{font-size:12px;font-weight:700;color:var(--muted);padding:12px 2px 4px;border-bottom:1px solid var(--line)}
.due{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.due{grid-template-columns:1fr}}
footer{margin-top:22px;font-size:12px;color:var(--muted)}
#lock{max-width:420px;margin:12vh auto 0}
label.chk{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px}
label.chk input{width:20px;height:20px}
</style>
</head>
<body>
<div class="wrap">

<div id="lock" class="card">
  <h1>Ordini clienti</h1>
  <p class="muted small">Dati cifrati. Inserisci la passphrase per sbloccarli su questo dispositivo.</p>
  <form id="f-lock" autocomplete="off">
    <input type="password" id="pass" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="chk"><input type="checkbox" id="ricorda"> Ricorda su questo dispositivo</label>
    <button type="submit" id="b-sblocca">Sblocca</button>
    <div class="err" id="lock-err"></div>
  </form>
</div>

<div id="app" hidden>
  <h1>Ordini clienti <span class="muted small" id="sub"></span></h1>

  <div class="nav" id="nav">
    <input type="radio" name="sez" id="n-cliente" value="cliente" checked><label for="n-cliente">Cliente</label>
    <input type="radio" name="sez" id="n-confronto" value="confronto"><label for="n-confronto">Confronto</label>
    <input type="radio" name="sez" id="n-riepilogo" value="riepilogo"><label for="n-riepilogo">Riepilogo</label>
    <input type="radio" name="sez" id="n-fermi" value="fermi"><label for="n-fermi">Fermi</label>
    <input type="radio" name="sez" id="n-prodotti" value="prodotti"><label for="n-prodotti">Prodotti</label>
    <input type="radio" name="sez" id="n-andamento" value="andamento"><label for="n-andamento">Andamento</label>
  </div>

  <section class="sez on" id="s-cliente">
    <input type="search" id="q" placeholder="Cerca cliente per nome, codice o città" autocapitalize="off" autocorrect="off">
    <ul class="ris" id="ris"></ul>
    <div id="scheda"></div>
  </section>

  <section class="sez" id="s-confronto">
    <select id="c-vista">
      <option value="sintesi">Sintesi dei due anni</option>
      <option value="delta">Clienti in calo e in crescita</option>
      <option value="persi">Clienti persi e nuovi</option>
      <option value="mix">Mix prodotto: chi ha smesso, chi ha iniziato</option>
      <option value="q4">Ultimo trimestre: chi ordinava un anno fa</option>
    </select>
    <div class="filtri" style="margin-top:8px">
      <select id="c-prov"></select>
      <select id="c-net"></select>
      <select id="c-tipo"></select>
      <select id="c-ord" hidden>
        <option value="calo">Dal calo maggiore</option>
        <option value="crescita">Dalla crescita maggiore</option>
      </select>
      <select id="c-pn" hidden>
        <option value="persi">Persi: ordinavano, quest'anno zero</option>
        <option value="nuovi">Nuovi: mai ordinato l'anno scorso</option>
      </select>
      <select id="c-cat" hidden></select>
      <select id="c-mix" hidden>
        <option value="smesso">Hanno smesso di comprarla</option>
        <option value="iniziato">Hanno iniziato a comprarla</option>
        <option value="mai">Mai comprata in due anni</option>
      </select>
    </div>
    <p class="muted small" id="c-tot"></p>
    <div id="c-out"></div>
  </section>

  <section class="sez" id="s-riepilogo">
    <p class="muted small nota-anno"></p>
    <div class="filtri">
      <select id="r-prov"></select>
      <select id="r-net"></select>
      <select id="r-tipo"></select>
      <select id="r-ord">
        <option value="merce">Ordina per merce</option>
        <option value="n">Ordina per numero ordini</option>
        <option value="ultimo">Ordina per ultimo ordine (più recente)</option>
        <option value="fermo">Ordina per giorni dall'ultimo ordine</option>
        <option value="nome">Ordina per nome</option>
      </select>
    </div>
    <p class="muted small" id="r-tot"></p>
    <div class="tabwrap"><table id="r-tab"></table></div>
  </section>

  <section class="sez" id="s-fermi">
    <p class="muted small nota-anno"></p>
    <div class="filtri">
      <select id="f-soglia">
        <option value="60">Nessun ordine da 60 giorni</option>
        <option value="90" selected>Nessun ordine da 90 giorni</option>
        <option value="120">Nessun ordine da 120 giorni</option>
        <option value="180">Nessun ordine da 180 giorni</option>
      </select>
      <select id="f-min">
        <option value="2" selected>Almeno 2 ordini nel periodo</option>
        <option value="1">Almeno 1 ordine nel periodo</option>
        <option value="4">Almeno 4 ordini nel periodo</option>
      </select>
    </div>
    <p class="muted small" id="f-tot"></p>
    <div class="tabwrap"><table id="f-tab"></table></div>
  </section>

  <section class="sez" id="s-prodotti">
    <p class="muted small nota-anno"></p>
    <h2>Categorie</h2>
    <div class="tabwrap"><table id="p-cat"></table></div>
    <h2>Chi compra e chi no</h2>
    <select id="p-sel"></select>
    <div class="due">
      <div><h3 id="p-si-t"></h3><div class="tabwrap"><table id="p-si"></table></div></div>
      <div><h3 id="p-no-t"></h3><div class="tabwrap"><table id="p-no"></table></div></div>
    </div>
    <h2>Articoli più venduti</h2>
    <select id="p-art-cat"></select>
    <div class="tabwrap"><table id="p-art"></table></div>
  </section>

  <section class="sez" id="s-andamento">
    <h2>Merce ordinata per mese</h2>
    <div class="card"><div class="leg" id="a-leg"></div><div id="a-graf"></div></div>
    <div class="tabwrap"><table id="a-tab"></table></div>
  </section>

  <footer id="foot"></footer>
</div>
</div>

<script>
"use strict";
var PAYLOAD = "__PAYLOAD__";
var BUILD_META = __BUILD_META__;
var LS_KEY = "mak-ordini-pass";
var D = null, CLI = [], CLIA = [], ORD = [], ANNO = "", PREC = "", TAGLIO = "", OGGI = new Date();
var MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* Formato numeri fatto a mano: toLocaleString("it-IT") non mette il punto delle migliaia sotto 10.000 */
function num(n, dec){
  var v = Number(n) || 0, p = Math.abs(v).toFixed(dec).split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (v < 0 && Number(p.join(".").replace(/\./g, "")) !== 0 ? "-" : "") + p[0] + (dec ? "," + p[1] : "");
}
function eur(n){ return num(n, 2) + " €"; }
function eur0(n){ return eur(n); }                       /* tutti gli importi con 2 decimali */
function qta(n){ return num(n, (Number(n) || 0) % 1 === 0 ? 0 : 2); }
function pct(prima, dopo){
  if(!prima) return dopo ? "nuovo" : "—";
  var v = 100 * (dopo / prima - 1);
  return (v > 0 ? "+" : "") + num(v, 1) + "%";
}
function seg(v){ return v > 0.004 ? "pos" : (v < -0.004 ? "neg" : ""); }
function eurS(v){ return (v > 0.004 ? "+" : "") + eur(v); }
function dataIt(s){ return s ? s.slice(8,10) + "/" + s.slice(5,7) + "/" + s.slice(2,4) : ""; }
function giorniDa(s){ if(!s) return null; var d = new Date(s.slice(0,10) + "T12:00:00"); return Math.max(0, Math.floor((OGGI - d) / 86400000)); }
function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

/* ---------- sblocco ---------- */
function decifra(pass){
  var p = PAYLOAD.split("."), salt = b64(p[0]), iv = b64(p[1]), ct = b64(p[2]);
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(function(k){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:BUILD_META.iter, hash:"SHA-256"},
        k, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    })
    .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct); })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function sblocca(pass, daMemoria){
  var err = $("lock-err");
  if(!window.crypto || !crypto.subtle){
    err.textContent = "Questo browser non permette la decifratura qui: apri la pagina da https:// (o da localhost).";
    return;
  }
  err.textContent = "Sblocco in corso…";
  decifra(pass).then(function(d){
    if(!daMemoria && $("ricorda").checked){ try { localStorage.setItem(LS_KEY, pass); } catch(e){} }
    D = d; avvia();
  }).catch(function(){
    if(daMemoria){ try { localStorage.removeItem(LS_KEY); } catch(e){} err.textContent = ""; }
    else err.textContent = "Passphrase non corretta.";
  });
}

/* ---------- preparazione dati ---------- */
function prepara(){
  ANNO = D.meta.al.slice(0,4); PREC = String(+ANNO - 1); TAGLIO = D.meta.al.slice(5,10);
  CLI = D.clienti.map(function(c, i){
    return {i:i, cod:c[0], nome:c[1], citta:c[2], prov:c[3], flag:c[4], anag:c[5], net:c[6] || "", tipo:c[7] || "",
            ordini:[], n:0, merce:0, cat:{}, primoA:null, ultimoA:null, ultimo:null, mesi:{},
            /* anno precedente: pp = a parita' di periodo (fino al giorno TAGLIO), q4 = dopo */
            p:{n:0, merce:0, cat:{}, npp:0, pp:0, ppcat:{}, nq4:0, q4:0, q4cat:{}, ultimo:null}};
  });
  function somma(obj, righe){ righe.forEach(function(r){ obj[r[7]] = (obj[r[7]] || 0) + r[6]; }); }
  D.ordini.forEach(function(o){                 // gia' ordinati dal piu' recente
    var c = CLI[o[1]], anno = o[2].slice(0,4), km = o[2].slice(0,7);
    c.ordini.push(o);
    if(!c.ultimo || o[2] > c.ultimo) c.ultimo = o[2];
    c.mesi[km] = (c.mesi[km] || 0) + o[5];
    if(anno === ANNO){
      c.n++; c.merce += o[5]; somma(c.cat, o[8]);
      if(!c.ultimoA || o[2] > c.ultimoA) c.ultimoA = o[2];
      if(!c.primoA || o[2] < c.primoA) c.primoA = o[2];
    } else if(anno === PREC){
      var p = c.p; p.n++; p.merce += o[5]; somma(p.cat, o[8]);
      if(!p.ultimo || o[2] > p.ultimo) p.ultimo = o[2];
      if(o[2].slice(5,10) <= TAGLIO){ p.npp++; p.pp += o[5]; somma(p.ppcat, o[8]); }
      else { p.nq4++; p.q4 += o[5]; somma(p.q4cat, o[8]); }
    }
  });
  CLI.forEach(function(c){
    c.fermo = giorniDa(c.ultimo);
    c.freq = c.n > 1 ? Math.round((new Date(c.ultimoA.slice(0,10)) - new Date(c.primoA.slice(0,10))) / 86400000 / (c.n - 1)) : null;
    c.delta = c.merce - c.p.pp;
    c.cerca = (c.nome + " " + c.cod + " " + c.citta).toLowerCase();
  });
  ORD = D.ordini.filter(function(o){ return o[2].slice(0,4) === ANNO; });
  CLIA = CLI.filter(function(c){ return c.n > 0; });
}
function catPrincipale(cat){
  var k = Object.keys(cat).sort(function(a, b){ return cat[b] - cat[a]; })[0];
  return k == null ? "" : D.cat[+k];
}
/* 12 mesi, due serie: anno precedente e anno corrente */
function serieMesi(valore){
  return MESI.map(function(et, i){
    var mm = (i < 9 ? "0" : "") + (i + 1);
    return {et:et, a:valore(PREC + "-" + mm) || 0, b:valore(ANNO + "-" + mm) || 0};
  });
}
function perMeseZona(){
  var agg = {};
  D.ordini.forEach(function(o){
    var k = o[2].slice(0,7), a = agg[k] || (agg[k] = {n:0, merce:0});
    a.n++; a.merce += o[5];
  });
  return agg;
}
function legenda(){ return '<i class="a"></i>' + PREC + '<i class="b"></i>' + ANNO; }
function grafico2(serie, alto){
  var W = 640, H = alto || 220, pl = 4, pb = 20, pt = 8, n = serie.length;
  var max = Math.max.apply(null, serie.map(function(d){ return Math.max(d.a, d.b); }).concat([1]));
  var passo = (W - pl * 2) / n, lb = passo * 0.36, s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Merce per mese, ' + PREC + ' e ' + ANNO + '">';
  serie.forEach(function(d, i){
    var x0 = pl + i * passo + (passo - lb * 2 - 2) / 2;
    [["b2", d.a, x0], ["b", d.b, x0 + lb + 2]].forEach(function(t){
      var h = (H - pb - pt) * t[1] / max;
      s += '<rect class="' + t[0] + '" x="' + t[2].toFixed(1) + '" y="' + (H - pb - h).toFixed(1) + '" width="' + lb.toFixed(1) + '" height="' + Math.max(h, 0.5).toFixed(1) + '" rx="2"></rect>';
    });
    s += '<text text-anchor="middle" x="' + (pl + i * passo + passo / 2).toFixed(1) + '" y="' + (H - 6) + '">' + d.et + '</text>';
  });
  return s + '</svg>';
}

/* ---------- sezione Cliente ---------- */
function cerca(){
  var q = $("q").value.trim().toLowerCase(), ul = $("ris");
  if(q.length < 2){ ul.innerHTML = ""; return; }
  var parole = q.split(/\s+/);
  var tr = CLI.filter(function(c){ return parole.every(function(p){ return c.cerca.indexOf(p) >= 0; }); })
              .sort(function(a, b){ return (b.merce + b.p.merce) - (a.merce + a.p.merce); }).slice(0, 30);
  ul.innerHTML = tr.length ? tr.map(function(c){
    return '<li data-cli="' + c.i + '"><b>' + esc(c.nome) + '</b> <span class="muted small">' + esc(c.cod) + ' · ' + esc(c.citta) + ' ' + esc(c.prov) +
           ' · ' + ANNO + ': ' + eur0(c.merce) + ' · ' + PREC + ': ' + eur0(c.p.merce) + '</span></li>';
  }).join("") : '<li class="muted">Nessun cliente trovato.</li>';
}
function apriCliente(i){
  var c = CLI[i];
  $("n-cliente").checked = true; mostraSezione("cliente");
  $("ris").innerHTML = ""; $("q").value = "";
  var h = '<div class="card"><h2 style="margin-top:0">' + esc(c.nome) +
    (c.flag ? '<span class="badge" title="Sigla accanto all\'indirizzo nel PDF ordine">' + esc(c.flag) + '</span>' : '') + '</h2>' +
    '<p class="muted small">Cod. ' + esc(c.cod) + ' · ' + esc(c.citta) + ' ' + esc(c.prov) + (c.tipo ? ' · ' + esc(c.tipo) : '') + (c.net ? ' · network ' + esc(c.net) : '') +
      (c.anag ? '' : ' · non in anagrafica MAK 2026') + '</p>' +
    '<div class="kpi">' +
      '<div><b>' + c.n + '</b><span>ordini ' + ANNO + '</span></div>' +
      '<div><b>' + eur0(c.merce) + '</b><span>merce ' + ANNO + ' (IVA escl.)</span></div>' +
      '<div><b>' + dataIt(c.ultimo) + '</b><span>ultimo ordine · ' + c.fermo + ' gg fa</span></div>' +
      '<div><b>' + (c.freq == null ? '—' : c.freq + ' gg') + '</b><span>tra un ordine e l\'altro</span></div>' +
    '</div>';
  /* confronto con l'anno precedente */
  var tg = TAGLIO.slice(3,5) + "/" + TAGLIO.slice(0,2);
  h += '<h3>Confronto ' + PREC + ' / ' + ANNO + '</h3>' +
    '<div class="kpi">' +
      '<div><b>' + eur0(c.p.pp) + '</b><span>' + PREC + ' fino al ' + tg + '</span></div>' +
      '<div><b>' + eur0(c.merce) + '</b><span>' + ANNO + ' fino al ' + tg + '</span></div>' +
      '<div><b class="' + seg(c.delta) + '">' + eurS(c.delta) + '</b><span>differenza · ' + pct(c.p.pp, c.merce) + '</span></div>' +

    }).join("") + '</table></div>' +

          '<div class="c">' + esc(r[0]) + ' · ' + esc(D.cat[r[7]]) + (r[2] ? ' · ' + esc(r[2]) : '') + (r[8] ? ' · coupon ' + esc(r[8]) : '') + '</div>' +
          '<div>' + qta(r[3]) + ' × ' + eur(r[4]) + (r[5] ? ' − ' + esc(r[5]) + '%' : '') + ' = <b>' + eur(r[6]) + '</b></div></div>';

/* ---------- sezione Riepilogo ---------- */
function rigaCli(c, extra){
  return '<tr class="tap" data-cli="' + c.i + '"><td><b>' + esc(c.nome) + '</b><br><span class="muted small">' + esc(c.citta) + ' ' + esc(c.prov) + '</span></td>' +
    '<td class="num">' + c.n + '</td><td class="num">' + eur0(c.merce) + '</td><td class="num">' + dataIt(c.ultimo) + '</td><td class="num">' + c.fermo + '</td>' + (extra || '') + '</tr>';
}
var TH_CLI = '<tr><th>Cliente</th><th class="num">Ordini</th><th class="num">Merce</th><th class="num">Ultimo</th><th class="num">Giorni</th></tr>';
function riepilogo(){
  var prov = $("r-prov").value, net = $("r-net").value, tipo = $("r-tipo").value, ord = $("r-ord").value;
  var l = CLIA.filter(function(c){
    return (!prov || c.prov === prov) && (!tipo || c.tipo === tipo) &&
           (!net || (net === "-" ? !c.net : c.net === net));
  });
  var f = {merce:function(a, b){ return b.merce - a.merce; }, n:function(a, b){ return b.n - a.n || b.merce - a.merce; },
           ultimo:function(a, b){ return a.fermo - b.fermo; }, fermo:function(a, b){ return b.fermo - a.fermo; },
           nome:function(a, b){ return a.nome.localeCompare(b.nome); }}[ord];
  l.sort(f);
  var tot = l.reduce(function(s, c){ return s + c.merce; }, 0), no = l.reduce(function(s, c){ return s + c.n; }, 0);
  $("r-tot").textContent = num(l.length, 0) + " clienti · " + num(no, 0) + " ordini · " + eur0(tot) + " di merce";
  $("r-tab").innerHTML = TH_CLI + l.map(function(c){ return rigaCli(c); }).join("");
}

/* ---------- sezione Fermi ---------- */
function fermi(){
  var soglia = +$("f-soglia").value, min = +$("f-min").value;
  var l = CLIA.filter(function(c){ return c.n >= min && c.fermo >= soglia; }).sort(function(a, b){ return b.merce - a.merce; });
  var tot = l.reduce(function(s, c){ return s + c.merce; }, 0);
  $("f-tot").textContent = l.length + " clienti fermi · " + eur0(tot) + " di merce ordinata nel " + ANNO + ", in ordine di valore";
  $("f-tab").innerHTML = TH_CLI + l.map(function(c){ return rigaCli(c); }).join("");
}

/* ---------- sezione Prodotti ---------- */
function prodotti(){
  var agg = D.cat.map(function(){ return {merce:0, q:0, righe:0, cli:{}}; }), tot = 0;
  ORD.forEach(function(o){ o[8].forEach(function(r){ var a = agg[r[7]]; a.merce += r[6]; a.q += r[3]; a.righe++; a.cli[o[1]] = 1; tot += r[6]; }); });
  $("p-cat").innerHTML = '<tr><th>Categoria</th><th class="num">Merce</th><th class="num">%</th><th class="num">Pezzi</th><th class="num">Clienti</th></tr>' +
    D.cat.map(function(n, i){ var a = agg[i];
      return '<tr><td>' + esc(n) + '</td><td class="num">' + eur0(a.merce) + '</td><td class="num">' + (tot ? (100 * a.merce / tot).toFixed(1).replace(".", ",") : "0") +
             '%</td><td class="num">' + qta(Math.round(a.q)) + '</td><td class="num">' + Object.keys(a.cli).length + '</td></tr>'; }).join("");
}
function chiCompra(){
  var k = +$("p-sel").value;
  var si = CLIA.filter(function(c){ return c.cat[k]; }).sort(function(a, b){ return b.cat[k] - a.cat[k]; });
  var no = CLIA.filter(function(c){ return !c.cat[k]; }).sort(function(a, b){ return b.merce - a.merce; });
  $("p-si-t").textContent = "Comprano " + D.cat[k] + " (" + si.length + ")";
  $("p-no-t").textContent = "Mai comprato nel " + ANNO + " (" + no.length + ")";
  $("p-si").innerHTML = '<tr><th>Cliente</th><th class="num">' + esc(D.cat[k]) + '</th></tr>' + si.map(function(c){
    return '<tr class="tap" data-cli="' + c.i + '"><td>' + esc(c.nome) + '<br><span class="muted small">' + esc(c.citta) + '</span></td><td class="num">' + eur0(c.cat[k]) + '</td></tr>'; }).join("");
  $("p-no").innerHTML = '<tr><th>Cliente</th><th class="num">Merce totale</th></tr>' + no.map(function(c){
    return '<tr class="tap" data-cli="' + c.i + '"><td>' + esc(c.nome) + '<br><span class="muted small">' + esc(c.citta) + '</span></td><td class="num">' + eur0(c.merce) + '</td></tr>'; }).join("");
}
function articoli(){
  var k = $("p-art-cat").value, agg = {};
  ORD.forEach(function(o){ o[8].forEach(function(r){
    if(k !== "" && r[7] !== +k) return;
    var a = agg[r[0]] || (agg[r[0]] = {cod:r[0], desc:r[1], q:0, merce:0, cli:{}});
    a.q += r[3]; a.merce += r[6]; a.cli[o[1]] = 1;
  }); });
  var l = Object.keys(agg).map(function(x){ return agg[x]; }).sort(function(a, b){ return b.merce - a.merce; }).slice(0, 30);
  $("p-art").innerHTML = '<tr><th>Articolo</th><th class="num">Pezzi</th><th class="num">Merce</th><th class="num">Clienti</th></tr>' + l.map(function(a){
    return '<tr><td>' + esc(a.desc) + '<br><span class="muted small">' + esc(a.cod) + '</span></td><td class="num">' + qta(a.q) + '</td><td class="num">' + eur0(a.merce) +
           '</td><td class="num">' + Object.keys(a.cli).length + '</td></tr>'; }).join("");
}

/* ---------- sezione Andamento ---------- */
function andamento(){

/* ---------- sezione Confronto ---------- */
function cliFiltrati(){
  var prov = $("c-prov").value, net = $("c-net").value, tipo = $("c-tipo").value;
  return CLI.filter(function(c){
    return (!prov || c.prov === prov) && (!tipo || c.tipo === tipo) && (!net || (net === "-" ? !c.net : c.net === net));
  });
}
function cella(c, sotto){
  return '<td><b>' + esc(c.nome) + '</b><br><span class="muted small">' + esc(c.citta) + ' ' + esc(c.prov) + (sotto ? ' · ' + esc(sotto) : '') + '</span></td>';
}
function tab(th, righe){ return '<div class="tabwrap"><table><tr>' + th.map(function(t, i){ return '<th' + (i ? ' class="num"' : '') + '>' + t + '</th>'; }).join("") + '</tr>' + righe.join("") + '</table></div>'; }
function confronto(){
  var v = $("c-vista").value, l = cliFiltrati(), tg = TAGLIO.slice(3,5) + "/" + TAGLIO.slice(0,2), out = "", tot = "";
  $("c-ord").hidden = v !== "delta"; $("c-pn").hidden = v !== "persi";
  $("c-cat").hidden = v !== "mix"; $("c-mix").hidden = v !== "mix";
  function S(f){ return l.reduce(function(s, c){ return s + f(c); }, 0); }
  if(v === "sintesi"){
    var a = S(function(c){ return c.p.pp; }), b = S(function(c){ return c.merce; });
    var na = S(function(c){ return c.p.npp; }), nb = S(function(c){ return c.n; });
    var ca = l.filter(function(c){ return c.p.npp > 0; }).length, cb = l.filter(function(c){ return c.n > 0; }).length;
    var ent = l.filter(function(c){ return c.p.npp > 0 && c.n > 0; });
    tot = "Dal 1° gennaio al " + tg + " di ciascun anno. Importi = merce ordinata sul B2B, non fatturato.";
    out = tab(["", PREC, ANNO, "Var."], [
      '<tr><td>Merce</td><td class="num">' + eur(a) + '</td><td class="num">' + eur(b) + '</td><td class="num ' + seg(b - a) + '">' + pct(a, b) + '</td></tr>',
      '<tr><td>Ordini</td><td class="num">' + num(na, 0) + '</td><td class="num">' + num(nb, 0) + '</td><td class="num ' + seg(nb - na) + '">' + pct(na, nb) + '</td></tr>',
      '<tr><td>Clienti ordinanti</td><td class="num">' + num(ca, 0) + '</td><td class="num">' + num(cb, 0) + '</td><td class="num ' + seg(cb - ca) + '">' + pct(ca, cb) + '</td></tr>',
      '<tr><td>Ordine medio</td><td class="num">' + eur(na ? a / na : 0) + '</td><td class="num">' + eur(nb ? b / nb : 0) + '</td><td class="num ' + seg((nb ? b / nb : 0) - (na ? a / na : 0)) + '">' + pct(na ? a / na : 0, nb ? b / nb : 0) + '</td></tr>',
      '<tr><td>' + PREC + ' dopo il ' + tg + '</td><td class="num">' + eur(S(function(c){ return c.p.q4; })) + '</td><td class="num">—</td><td class="num">—</td></tr>',
      '<tr><td>' + PREC + ' anno intero</td><td class="num">' + eur(S(function(c){ return c.p.merce; })) + '</td><td class="num">—</td><td class="num">—</td></tr>'
    ]) + '<h3>Clienti</h3>' + tab(["", "Clienti", PREC, ANNO], [
      '<tr><td>In entrambi gli anni</td><td class="num">' + ent.length + '</td><td class="num">' + eur(ent.reduce(function(s, c){ return s + c.p.pp; }, 0)) + '</td><td class="num">' + eur(ent.reduce(function(s, c){ return s + c.merce; }, 0)) + '</td></tr>',
      '<tr><td>&nbsp;&nbsp;di cui in crescita</td><td class="num">' + ent.filter(function(c){ return c.delta > 0; }).length + '</td><td class="num"></td><td class="num"></td></tr>',
      '<tr><td>&nbsp;&nbsp;di cui in calo</td><td class="num">' + ent.filter(function(c){ return c.delta < 0; }).length + '</td><td class="num"></td><td class="num"></td></tr>',
      '<tr><td>Solo ' + PREC + '</td><td class="num">' + (ca - ent.length) + '</td><td class="num">' + eur(a - ent.reduce(function(s, c){ return s + c.p.pp; }, 0)) + '</td><td class="num">—</td></tr>',
      '<tr><td>Solo ' + ANNO + '</td><td class="num">' + (cb - ent.length) + '</td><td class="num">—</td><td class="num">' + eur(b - ent.reduce(function(s, c){ return s + c.merce; }, 0)) + '</td></tr>'
    ]) + '<h3>Categorie</h3>' + tab(["Categoria", PREC, ANNO, "Differenza", "Var."],
      D.cat.map(function(n, k){ return [n, S(function(c){ return c.p.ppcat[k] || 0; }), S(function(c){ return c.cat[k] || 0; })]; })
        .filter(function(x){ return x[1] || x[2]; }).sort(function(x, y){ return (y[1] + y[2]) - (x[1] + x[2]); })
        .map(function(x){ return '<tr><td>' + esc(x[0]) + '</td><td class="num">' + eur(x[1]) + '</td><td class="num">' + eur(x[2]) + '</td><td class="num ' + seg(x[2] - x[1]) + '">' + eurS(x[2] - x[1]) +
                                 '</td><td class="num ' + seg(x[2] - x[1]) + '">' + pct(x[1], x[2]) + '</td></tr>'; }));
  } else if(v === "delta"){
    var calo = $("c-ord").value === "calo";
    var r = l.filter(function(c){ return c.p.npp > 0 || c.n > 0; }).filter(function(c){ return calo ? c.delta < 0 : c.delta > 0; })
             .sort(function(x, y){ return calo ? x.delta - y.delta : y.delta - x.delta; });
    tot = r.length + " clienti " + (calo ? "in calo" : "in crescita") + " per " + eurS(r.reduce(function(s, c){ return s + c.delta; }, 0)) + " complessivi, a parità di periodo (fino al " + tg + ").";
    out = tab(["Cliente", PREC, ANNO, "Differenza", "Var."], r.map(function(c){
      return '<tr class="tap" data-cli="' + c.i + '">' + cella(c) + '<td class="num">' + eur(c.p.pp) + '</td><td class="num">' + eur(c.merce) + '</td><td class="num ' + seg(c.delta) + '"><b>' + eurS(c.delta) +
             '</b></td><td class="num ' + seg(c.delta) + '">' + pct(c.p.pp, c.merce) + '</td></tr>'; }));
  } else if(v === "persi"){

      out = tab(["Cliente", PREC + " al " + tg, PREC + " anno", "Ordini " + PREC, "Ultimo ordine"], r2.map(function(c){
        return '<tr class="tap" data-cli="' + c.i + '">' + cella(c, catPrincipale(c.p.cat)) + '<td class="num"><b>' + eur(c.p.pp) + '</b></td><td class="num">' + eur(c.p.merce) + '</td><td class="num">' + c.p.n +

      tot = r3.length + " clienti hanno ordinato nel " + ANNO + " senza alcun ordine nel " + PREC + ": valgono " + eur(r3.reduce(function(s, c){ return s + c.merce; }, 0)) + ".";
      out = tab(["Cliente", ANNO, "Ordini", "Primo ordine", "Ultimo ordine"], r3.map(function(c){

               '</td><td class="num">' + dataIt(c.ultimoA) + '</td></tr>'; }));
    }
  } else if(v === "mix"){

      tot = r4.length + " clienti compravano " + nome + " fino al " + tg + " " + PREC + " e nel " + ANNO + " non l'hanno più presa: " + eur(r4.reduce(function(s, c){ return s + c.p.ppcat[k]; }, 0)) + ".";
      out = tab(["Cliente", nome + " " + PREC, "Totale " + ANNO, "Ultimo ordine"], r4.map(function(c){

    } else if(m === "iniziato"){
      r4 = l.filter(function(c){ return c.cat[k] > 0 && !c.p.cat[k]; }).sort(function(x, y){ return y.cat[k] - x.cat[k]; });
      tot = r4.length + " clienti hanno comprato " + nome + " nel " + ANNO + " senza averla mai presa nel " + PREC + ": " + eur(r4.reduce(function(s, c){ return s + c.cat[k]; }, 0)) + ".";
      out = tab(["Cliente", nome + " " + ANNO, "Totale " + ANNO, "Totale " + PREC], r4.map(function(c){
        return '<tr class="tap" data-cli="' + c.i + '">' + cella(c, c.p.n ? "" : "cliente nuovo") + '<td class="num"><b>' + eur(c.cat[k]) + '</b></td><td class="num">' + eur(c.merce) + '</td><td class="num">' + eur(c.p.merce) + '</td></tr>'; }));
    } else {

      out = tab(["Cliente", "Totale " + ANNO, "Totale " + PREC, "Ultimo ordine"], r4.map(function(c){

    out = tab(["Cliente", PREC + " dopo il " + tg, "Ordini", ANNO + " finora", "Giorni dall'ultimo"], r5.map(function(c){
      return '<tr class="tap" data-cli="' + c.i + '">' + cella(c, catPrincipale(c.p.q4cat)) + '<td class="num"><b>' + eur(c.p.q4) + '</b></td><td class="num">' + c.p.nq4 + '</td><td class="num">' +

  $("sub").textContent = PREC + " e " + ANNO + " · fino al " + dataIt(D.meta.al);
  var note = document.querySelectorAll(".nota-anno");
  for(var ni = 0; ni < note.length; ni++) note[ni].textContent = "Dati del " + ANNO + ". Per il " + PREC + " vedi Confronto e la scheda cliente.";
  function opzioni(campo, tutte, vuoto, lista){
    var n = {}; (lista || CLIA).forEach(function(c){ if(c[campo]) n[c[campo]] = (n[c[campo]] || 0) + 1; });
    return '<option value="">' + tutte + '</option>' + (vuoto ? '<option value="-">' + vuoto + '</option>' : '') +
      Object.keys(n).sort(function(a, b){ return n[b] - n[a]; })
        .map(function(k){ return '<option value="' + esc(k) + '">' + esc(k) + ' (' + n[k] + ')</option>'; }).join("");
  }
  $("r-prov").innerHTML = opzioni("prov", "Tutte le province", "");
  $("r-net").innerHTML = opzioni("net", "Tutti i network", "Nessun network");
  $("c-prov").innerHTML = opzioni("prov", "Tutte le province", "", CLI);
  $("c-net").innerHTML = opzioni("net", "Tutti i network", "Nessun network", CLI);
  $("c-tipo").innerHTML = opzioni("tipo", "Tutti i tipi di cliente", "", CLI);
  $("r-tipo").innerHTML = opzioni("tipo", "Tutti i tipi di cliente", "");
  var optCat = D.cat.map(function(n, i){ return '<option value="' + i + '">' + esc(n) + '</option>'; }).join("");
  $("p-sel").innerHTML = optCat;
  var pref = -1; D.cat.forEach(function(n, i){ if(pref < 0 && /ruotino/i.test(n)) pref = i; });
  if(pref >= 0) $("p-sel").value = String(pref);
  $("p-art-cat").innerHTML = '<option value="">Tutte le categorie</option>' + optCat;
  $("c-cat").innerHTML = optCat;
  riepilogo(); fermi(); prodotti(); chiCompra(); articoli(); andamento(); confronto();
  $("foot").innerHTML = num(D.meta.ordini, 0) + " ordini di " + num(D.meta.clienti, 0) + " clienti, " + PREC + " e " + ANNO + " · aggiornato il " + esc(D.meta.build) +
    "<br>Solo ordini passati dal portale B2B. Importi = merce ordinata, IVA, spedizione e PFU esclusi. Non sono fatture: resi e note di credito non compaiono." +
    '<br><button class="link" id="b-esci" type="button">Dimentica la passphrase su questo dispositivo</button>';
}

document.addEventListener("DOMContentLoaded", function(){
  $("f-lock").addEventListener("submit", function(e){ e.preventDefault(); var p = $("pass").value; if(p) sblocca(p, false); });
  $("nav").addEventListener("change", function(e){ if(e.target && e.target.name === "sez") mostraSezione(e.target.value); });
  $("q").addEventListener("input", cerca);
  $("r-prov").addEventListener("change", riepilogo);
  $("r-ord").addEventListener("change", riepilogo);
  $("r-net").addEventListener("change", riepilogo);
  $("r-tipo").addEventListener("change", riepilogo);
  ["c-vista", "c-prov", "c-net", "c-tipo", "c-ord", "c-pn", "c-cat", "c-mix"].forEach(function(id){ $(id).addEventListener("change", confronto); });
  $("f-soglia").addEventListener("change", fermi);
  $("f-min").addEventListener("change", fermi);
  $("p-sel").addEventListener("change", chiCompra);
  $("p-art-cat").addEventListener("change", articoli);
  document.addEventListener("click", function(e){
    var t = e.target;
    if(t && t.id === "b-esci"){ try { localStorage.removeItem(LS_KEY); } catch(x){} location.reload(); return; }
    while(t && t !== document){
      if(t.getAttribute && t.getAttribute("data-cli") != null){ apriCliente(+t.getAttribute("data-cli")); return; }
      t = t.parentNode;
    }
  });
  var salvata = null; try { salvata = localStorage.getItem(LS_KEY); } catch(e){}
  if(salvata) sblocca(salvata, true);
});
</script>
</body>
</html>
